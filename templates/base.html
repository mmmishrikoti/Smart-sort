<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f3">
  <meta name="description" content="SortSmart AI helps you understand waste sorting with image-based classification and practical recycling guidance.">
  <title>{% block title %}SortSmart AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="SortSmart AI home">
      <span class="brand-mark" aria-hidden="true">s</span>
      <span>sortsmart<span class="brand-ai">.ai</span></span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Open navigation">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ url_for('scanner') }}" {% if request.endpoint == 'scanner' %}aria-current="page"{% endif %}>AI scanner</a>
      <a href="{{ url_for('guide') }}" {% if request.endpoint == 'guide' %}aria-current="page"{% endif %}>Waste guide</a>
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}aria-current="page"{% endif %}>History</a>
    </nav>
    <a class="button button-small button-dark header-cta" href="{{ url_for('scanner') }}">Start scanning <span aria-hidden="true">↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark" aria-hidden="true">s</span><span>sortsmart<span class="brand-ai">.ai</span></span></a>
    <p>Small sorting decisions. A lighter footprint.</p>
    <span>AI-assisted guidance · Always check local rules</span>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
